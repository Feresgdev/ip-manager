services:
  server:
    build:
      context: .
      dockerfile: ${DOCKERFILE:-docker.dev}
    container_name: express-api
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
    develop:
      watch:
        - action: sync+restart
          path: ./server
          target: /app/server
        # Rebuild when dependencies change
        - action: rebuild
          path: ./package.json

        - action: rebuild
          path: ./package-lock.json

  postgres:
    image: postgres:17-alpine
    container_name: boilerplate_postgres
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: boilerplate_-pgadmin
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:7-alpine
    container_name: boilerplate_-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: boilerplate_redis_insight
    restart: unless-stopped
    ports:
      - "8001:5540"
    environment:
      - RITRUSTEDORIGINS=http://localhost:8001
    volumes:
      - redis_insight_data:/db
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  redis_insight_data:
